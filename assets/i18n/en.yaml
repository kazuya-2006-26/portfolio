about:
    title: About Me
    text: I’m Jaydey — a curious and structured developer who learns quickly when a topic genuinely interests me. My interest in programming began in primary school with Scratch and grew during VMBO, where I built websites and Discord bots. Eventually, I chose software development as my study path. During my internships at the municipality of Urk and at Quotec, I discovered my love for embedded and low‑level software, working with binary and hexadecimal, and designing modular, expandable systems.
    text2: Outside of programming, I’m a quiet and introverted person who enjoys cooking, anime, gaming, music, D&D, hardware tinkering, and walking in the forest. I love projects where I can figure out how things really work. In my ideal job, I want to use my skills to contribute to solutions for major challenges like food shortages, worker shortages, climate issues, or machines that make work more efficient. I want to build software that matters — logical, modular, and impactful.

