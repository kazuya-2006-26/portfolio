about:
    title: Over Mij
    text: Ik ben Jaydey — een nieuwsgierige en gestructureerde ontwikkelaar die snel leert wanneer een onderwerp me echt interesseert. Mijn interesse voor programmeren begon op de basisschool met Scratch en groeide tijdens het VMBO uit tot het bouwen van websites en Discord‑bots. Uiteindelijk koos ik voor softwareontwikkeling als vervolgopleiding. Tijdens mijn stages bij de gemeente Urk en Quotec ontdekte ik mijn liefde voor embedded en low‑level software, binair en hexadecimaal werken, en het ontwerpen van modulaire, uitbreidbare systemen.
    text2: Buiten het programmeren ben ik een rustig en introvert persoon die houdt van koken, anime, gamen, muziek, D&D, hardware‑tinkering en wandelen in het bos. Ik geniet van projecten waarbij ik kan uitzoeken hoe dingen écht werken. In mijn droombaan kan ik mijn vaardigheden in zetten voor oplossingen die bijdragen aan grote uitdagingen zoals voedseltekorten, personeelstekorten en klimaatproblemen of machines die het werk efficiënter maken. Ik wil software bouwen die ertoe doet — logisch, modulair en met impact.
